<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcade</title>

  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
  <link rel="preload" href="https://cdn.emulatorjs.org/stable/data/loader.js" as="script" crossorigin>
  <link rel="preload" href="/roms/mslugx.zip" as="fetch">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
      color: #f4f4f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #cabinet {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.06), transparent 32rem),
        linear-gradient(180deg, #111 0%, #050505 100%);
    }

    #game {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #game canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
      background: #000;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 30, 30, 0.18), transparent 24rem),
        rgba(0, 0, 0, 0.88);
      transition: opacity 220ms ease;
    }

    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-button {
      appearance: none;
      border: 2px solid #f6d36b;
      background: #141414;
      color: #f6d36b;
      padding: 1rem 2rem;
      border-radius: 999px;
      font-size: clamp(1.4rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      cursor: pointer;
      box-shadow:
        0 0 0 6px rgba(246, 211, 107, 0.08),
        0 0 32px rgba(246, 211, 107, 0.28),
        inset 0 0 24px rgba(246, 211, 107, 0.08);
      text-transform: uppercase;
    }

    #start-button:active {
      transform: translateY(2px);
    }

    #loading {
      position: fixed;
      left: 50%;
      bottom: 2rem;
      z-index: 11;
      transform: translateX(-50%);
      color: #f6d36b;
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    #loading.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <main id="cabinet">
    <div id="game"></div>
  </main>

  <div id="start-overlay">
    <button id="start-button" type="button">Start</button>
  </div>

  <div id="loading">Loading</div>

  <script>
    const ROM_URL = "/roms/mslugx.zip";
    const CORE = "fbneo";
    const DATA_PATH = "https://cdn.emulatorjs.org/stable/data/";

    let started = false;

    document.getElementById("start-button").addEventListener("click", () => {
      if (started) return;
      started = true;

      document.getElementById("loading").classList.add("visible");

      window.EJS_player = "#game";
      window.EJS_core = CORE;
      window.EJS_gameName = "Metal Slug X";
      window.EJS_gameUrl = ROM_URL;
      window.EJS_pathtodata = DATA_PATH;

      // Start after the user click so audio can wake up cleanly.
      window.EJS_startOnLoaded = true;

      // No extra BIOS. Your merged / massaged zip is the truth.
      window.EJS_biosUrl = "";

      // Avoid the en-GB localization 404 noise.
      window.EJS_language = "en-US";
      window.EJS_disableAutoLang = true;

      // No threaded mode, so no custom Netlify headers needed.
      window.EJS_threads = false;

      // Cleaner arcade UI.
      window.EJS_alignStartButton = "center";
      window.EJS_backgroundColor = "#000";
      window.EJS_color = "#f6d36b";
      window.EJS_volume = 1;

      // Hide the toolbar chrome. EmulatorJS documents EJS_Buttons for this.
      window.EJS_Buttons = {
        playPause: false,
        restart: false,
        mute: false,
        settings: false,
        fullscreen: false,
        saveState: false,
        loadState: false,
        screenRecord: false,
        gamepad: false,
        cheat: false,
        volume: false,
        saveSavFiles: false,
        loadSavFiles: false,
        quickSave: false,
        quickLoad: false,
        screenshot: false,
        cacheManager: false,
        exitEmulation: false
      };

      window.EJS_onGameStart = () => {
        document.getElementById("start-overlay").classList.add("hidden");
        document.getElementById("loading").classList.remove("visible");
      };

      const loader = document.createElement("script");
      loader.src = DATA_PATH + "loader.js";
      loader.async = true;
      document.body.appendChild(loader);
    });
  </script>
</body>
</html>
