<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcade</title>

  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
  <link rel="preload" href="https://cdn.emulatorjs.org/stable/data/loader.js" as="script" crossorigin>
  <link rel="preload" href="/roms/mslugx.zip" as="fetch">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #f4f4f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #cabinet {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #game {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #game canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
      background: #000;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 30, 30, 0.18), transparent 24rem),
        rgba(0, 0, 0, 0.9);
      transition: opacity 220ms ease;
    }

    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-card {
      display: grid;
      gap: 1.2rem;
      justify-items: center;
      text-align: center;
      padding: 2rem;
    }

    #start-button {
      appearance: none;
      border: 2px solid #f6d36b;
      background: #141414;
      color: #f6d36b;
      padding: 1rem 2.2rem;
      border-radius: 999px;
      font-size: clamp(1.4rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      cursor: pointer;
      box-shadow:
        0 0 0 6px rgba(246, 211, 107, 0.08),
        0 0 32px rgba(246, 211, 107, 0.28),
        inset 0 0 24px rgba(246, 211, 107, 0.08);
      text-transform: uppercase;
    }

    #start-button:active {
      transform: translateY(2px);
    }

    #hint {
      color: rgba(246, 211, 107, 0.82);
      font-size: clamp(0.8rem, 2vw, 1rem);
      line-height: 1.7;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #loading {
      position: fixed;
      left: 50%;
      bottom: 2rem;
      z-index: 21;
      transform: translateX(-50%);
      color: #f6d36b;
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    #loading.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <main id="cabinet">
    <div id="game" tabindex="-1"></div>
  </main>

  <div id="start-overlay">
    <div id="start-card">
      <button id="start-button" type="button">Start</button>

      <div id="hint">
        Coin: V<br>
        Start: Enter<br>
        Move: Arrow keys<br>
        Buttons: Z X A S<br>
        Controls/Menu: bottom bar
      </div>
    </div>
  </div>

  <div id="loading">Loading</div>

  <script>
    const ROM_URL = "/roms/mslugx.zip";
    const CORE = "fbneo";
    const DATA_PATH = "https://cdn.emulatorjs.org/stable/data/";

    let started = false;

    document.getElementById("start-button").addEventListener("click", () => {
      if (started) return;
      started = true;

      document.getElementById("loading").classList.add("visible");

      window.EJS_player = "#game";
      window.EJS_core = CORE;
      window.EJS_gameName = "Metal Slug X";
      window.EJS_gameUrl = ROM_URL;
      window.EJS_pathtodata = DATA_PATH;

      // Start only after click, otherwise browser audio policy can bite.
      window.EJS_startOnLoaded = true;

      // No BIOS, no parent ROM. Your merged zip is the complete romset.
      window.EJS_biosUrl = "";
      window.EJS_gameParentUrl = "";

      // Avoid en-GB localization fetch noise.
      window.EJS_language = "en-US";
      window.EJS_disableAutoLang = true;

      // No custom headers needed.
      window.EJS_threads = false;

      window.EJS_backgroundColor = "#000";
      window.EJS_color = "#f6d36b";
      window.EJS_volume = 1;

      // Keyboard defaults.
      // EmulatorJS labels index 2 as SELECT and index 3 as START.
      // For arcade/Neo Geo, SELECT is your coin button.
      window.EJS_defaultControls = {
        0: {
          0: { value: "z", value2: "BUTTON_2" },          // B / arcade button
          1: { value: "x", value2: "BUTTON_4" },          // Y / arcade button
          2: { value: "v", value2: "SELECT" },            // COIN
          3: { value: "enter", value2: "START" },         // START
          4: { value: "up arrow", value2: "DPAD_UP" },
          5: { value: "down arrow", value2: "DPAD_DOWN" },
          6: { value: "left arrow", value2: "DPAD_LEFT" },
          7: { value: "right arrow", value2: "DPAD_RIGHT" },
          8: { value: "a", value2: "BUTTON_1" },          // A / arcade button
          9: { value: "s", value2: "BUTTON_3" },          // X / arcade button
          10: { value: "q", value2: "LEFT_TOP_SHOULDER" },
          11: { value: "e", value2: "RIGHT_TOP_SHOULDER" },
          12: { value: "tab", value2: "LEFT_BOTTOM_SHOULDER" },
          13: { value: "r", value2: "RIGHT_BOTTOM_SHOULDER" },
          24: { value: "1" },
          25: { value: "2" },
          26: { value: "3" }
        },
        1: {},
        2: {},
        3: {}
      };

      // Playable but still clean: keep control/settings/fullscreen/audio alive.
      window.EJS_Buttons = {
        playPause: true,
        restart: true,
        mute: true,
        volume: true,
        settings: true,
        gamepad: true,
        fullscreen: true,
        saveState: true,
        loadState: true,

        // Hide the fluff.
        screenRecord: false,
        cheat: false,
        quickSave: false,
        quickLoad: false,
        screenshot: false,
        cacheManager: false,
        saveSavFiles: false,
        loadSavFiles: false,
        exitEmulation: false
      };

      window.EJS_onGameStart = () => {
        document.getElementById("start-overlay").classList.add("hidden");
        document.getElementById("loading").classList.remove("visible");

        // Give the emulator keyboard focus.
        setTimeout(() => {
          const game = document.getElementById("game");
          game.focus();

          const canvas = document.querySelector("#game canvas");
          if (canvas) {
            canvas.setAttribute("tabindex", "-1");
            canvas.focus();
          }
        }, 250);
      };

      const loader = document.createElement("script");
      loader.src = DATA_PATH + "loader.js";
      loader.async = true;
      document.body.appendChild(loader);
    });
  </script>
</body>
</html>
